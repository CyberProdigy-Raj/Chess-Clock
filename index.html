<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
    <title>Clock-Raj</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <!-- SETUP -->
  <div id="setupScreen">
    <div class="brand">
      <span class="mark"></span>
      <h1>Clock<span>-</span>Raj</h1>
    </div>
    <p class="tagline">A clean chess clock</p>

    <div class="setup-col">

      <div class="section-label">Bullet</div>
      <div class="preset-grid" id="grid-bullet"></div>

      <div class="section-label">Blitz</div>
      <div class="preset-grid" id="grid-blitz"></div>

      <div class="section-label">Rapid</div>
      <div class="preset-grid" id="grid-rapid"></div>

      <div class="section-label">Classical</div>
      <div class="preset-grid" id="grid-classical"></div>

      <div class="section-label">Custom</div>
      <div id="customToggle" class="custom-toggle">
        <span>Set your own time per player</span>
        <span class="chev">&#9662;</span>
      </div>
      <div id="customPanel" class="custom-panel">
        <div class="custom-inner">
          <label class="mirror-row">
            <input type="checkbox" id="mirrorCheck" checked>
            Same time control for both players
          </label>

          <div class="player-config-row">
            <div class="pc-card white">
              <h4><span class="dot"></span>White</h4>
              <div class="field-row">
                <div class="field">
                  <label>Minutes</label>
                  <input type="number" id="wMin" min="0" value="5" inputmode="numeric">
                </div>
                <div class="field">
                  <label>Seconds</label>
                  <input type="number" id="wSec" min="0" max="59" value="0" inputmode="numeric">
                </div>
              </div>
              <div class="field-row">
                <div class="field">
                  <label>Increment (s)</label>
                  <input type="number" id="wInc" min="0" value="0" inputmode="numeric">
                </div>
              </div>
            </div>

            <div class="pc-card black">
              <h4><span class="dot"></span>Black</h4>
              <div class="field-row">
                <div class="field">
                  <label>Minutes</label>
                  <input type="number" id="bMin" min="0" value="5" inputmode="numeric">
                </div>
                <div class="field">
                  <label>Seconds</label>
                  <input type="number" id="bSec" min="0" max="59" value="0" inputmode="numeric">
                </div>
              </div>
              <div class="field-row">
                <div class="field">
                  <label>Increment (s)</label>
                  <input type="number" id="bInc" min="0" value="0" inputmode="numeric">
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <button id="startBtn" disabled>
        Start game
        <span class="sel-echo" id="selEcho">Choose a time control above</span>
      </button>
    </div>
  </div>

  <!-- CLOCK -->
  <div id="clockScreen">
    <div class="half half-top" id="halfBlack" data-idx="1">
      <div class="half-content">
        <div class="player-name"><span class="dot"></span>Black</div>
        <div class="time" id="timeBlack">05:00</div>
        <div class="inc-tag" id="incBlack" style="display:none;"></div>
        <div class="flag-msg" id="flagBlack" style="display:none;">Time's up</div>
      </div>
    </div>

    <div class="center-label" id="centerLabel">READY</div>
    <div class="control-bar">
      <button id="btnMenu" title="Time control">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20a8 8 0 100-16 8 8 0 000 16z"/><path d="M12 14a2 2 0 100-4 2 2 0 000 4z"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <button id="btnPause" title="Pause / Resume">
        <svg id="pauseIcon" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>
        <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor" style="display:none;"><path d="M7 4l14 8-14 8V4z"/></svg>
      </button>
      <button id="btnReset" title="New game">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
      </button>
    </div>
    <div class="ready-hint" id="readyHint">tap your side to begin</div>

    <div class="half half-bottom" id="halfWhite" data-idx="0">
      <div class="half-content">
        <div class="player-name"><span class="dot"></span>White</div>
        <div class="time" id="timeWhite">05:00</div>
        <div class="inc-tag" id="incWhite" style="display:none;"></div>
        <div class="flag-msg" id="flagWhite" style="display:none;">Time's up</div>
      </div>
    </div>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
